<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegacyNW | Resmi Sunucu Sayfası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a13;
    --bg-2: #090f1f;
    --panel: rgba(18, 27, 45, 0.7);
    --panel-hover: rgba(23, 35, 59, 0.85);
    --border: rgba(61, 127, 232, 0.15);
    --border-hover: rgba(61, 127, 232, 0.4);
    --border-soft: rgba(255, 255, 255, 0.05);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --muted-2: #475569;
    --blue: #3d7fe8;
    --blue-bright: #6fa3f5;
    --blue-glow: rgba(61, 127, 232, 0.25);
    --gold: #f0b429;
    --gold-bright: #ffce5c;
    --gold-glow: rgba(240, 180, 41, 0.25);
    --ok: #4ade80;
    --danger: #ef4444;
  }
  
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  ::selection{background:var(--blue);color:#050912;}
  
  /* Özel Scrollbar */
  ::-webkit-scrollbar {width: 8px;}
  ::-webkit-scrollbar-track {background: var(--bg);}
  ::-webkit-scrollbar-thumb {background: var(--muted-2); border-radius: 4px;}
  ::-webkit-scrollbar-thumb:hover {background: var(--blue-bright);}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x: hidden;
  }
  
  h1,h2,h3,.display{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:0.02em;font-weight:800;margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;max-width:100%;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  
  /* Butonlar */
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:'Space Grotesk';font-weight:600;font-size:14.5px;padding:14px 28px;border-radius:8px;transition:all .25s cubic-bezier(0.4, 0, 0.2, 1);}
  .btn-primary{background:linear-gradient(135deg, var(--blue), var(--blue-bright));color:#04070D;box-shadow: 0 4px 15px var(--blue-glow);}
  .btn-primary:hover{box-shadow:0 6px 25px var(--blue-glow);transform:translateY(-2px);filter: brightness(1.1);}
  .btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold-bright));color:#241900;box-shadow: 0 4px 15px var(--gold-glow);}
  .btn-gold:hover{box-shadow:0 6px 25px var(--gold-glow);transform:translateY(-2px);filter: brightness(1.1);}
  .btn-ghost{background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--text);backdrop-filter: blur(5px);}
  .btn-ghost:hover{border-color:var(--blue-bright);color:var(--blue-bright);background:rgba(61,127,232,0.05);transform:translateY(-1px);}
  .btn-block{width:100%;justify-content:center;}
  
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue-bright);outline-offset:2px;}

  /* ---------- NAV (GLASSMORPHISM) ---------- */
  header{position:sticky;top:0;z-index:200;background:rgba(6, 10, 19, 0.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft);box-shadow: 0 4px 30px rgba(0,0,0,0.2);}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:12px;font-family:'Big Shoulders Display';font-weight:900;font-size:24px;letter-spacing:0.05em;color: #fff;}
  .crest{width:34px;height:34px;position:relative;flex:none;filter: drop-shadow(0 0 8px var(--blue-glow));}
  .navlinks{display:flex;gap:32px;align-items:center;font-size:14px;font-weight: 500;}
  .navlinks a{color:var(--muted);position:relative;padding:4px 0;transition: color .2s;}
  .navlinks a::after{content:"";position:absolute;left:50%;bottom:-2px;width:0;height:2px;background:var(--blue-bright);transition:all .25s ease;transform: translateX(-50%);border-radius: 2px;}
  .navlinks a:hover{color:var(--text);}
  .navlinks a:hover::after{width:100%;}
  .nav-actions{display:flex;gap:12px;align-items:center;}
  
  .burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;}
  .burger span{width:22px;height:2px;background:var(--text);display:block;transition: .3s;}
  .mobile-menu{display:none;flex-direction:column;padding:0 24px 18px;background: var(--bg-2);}
  .mobile-menu a{padding:14px 0;border-top:1px solid var(--border-soft);color:var(--muted);font-size:15px;}
  header.open .mobile-menu{display:flex;}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;padding:140px 0 90px;text-align:center;border-bottom:1px solid var(--border-soft);}
  .hero::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(circle 600px at 50% -10%, rgba(61,127,232,0.18), transparent 70%),
      radial-gradient(circle 500px at 90% 120%, rgba(240,180,41,0.06), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 49px, rgba(111,163,245,0.015) 49px 50px),
      repeating-linear-gradient(90deg, transparent 0 49px, rgba(111,163,245,0.015) 49px 50px);
  }
  
  /* Animasyonlu Küpler */
  .floating-block{position:absolute;width:46px;height:46px;border:1px solid rgba(111,163,245,0.2);background:linear-gradient(145deg,rgba(61,127,232,0.1),rgba(18,27,45,0.2));border-radius:8px;animation:float 8s ease-in-out infinite;z-index:0;backdrop-filter: blur(2px);}
  .fb1{top:15%;left:8%;animation-delay:0s;}
  .fb2{top:70%;left:5%;width:28px;height:28px;animation-delay:1.5s;animation-duration: 6s;}
  .fb3{top:20%;right:8%;animation-delay:0.8s;}
  .fb4{top:65%;right:12%;width:34px;height:34px;border-color:rgba(240,180,41,0.2);background:linear-gradient(145deg,rgba(240,180,41,0.08),rgba(18,27,45,0.2));animation-delay:2.2s;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(8deg);}}
  
  .hero-content{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 24px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono';color:var(--ok);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;border:1px solid rgba(74, 222, 128, 0.2);background: rgba(74, 222, 128, 0.05);padding:8px 16px;border-radius:30px;margin-bottom:28px;}
  .dot{width:6px;height:6px;background:var(--ok);border-radius:50%;box-shadow:0 0 10px var(--ok);animation: pulse 2s infinite;}
  @keyframes pulse {0%, 100% {opacity: 0.5;} 50% {opacity: 1; transform: scale(1.2);}}
  
  .hero h1{font-size:clamp(44px,7vw,76px);line-height:0.95;margin-bottom:24px;letter-spacing: -0.01em;}
  .hero h1 .accent{background:linear-gradient(90deg,var(--blue-bright),var(--gold-bright));-webkit-background-clip:text;background-clip:text;color:transparent;filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));}
  .hero p.lead{color:var(--muted);font-size:18px;margin:0 0 40px;max-width: 600px;margin-left: auto;margin-right: auto;}
  .hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

  /* ---------- SERVER STATUS BAR ---------- */
  .status-bar{background:var(--bg-2);border-bottom:1px solid var(--border-soft);position: relative;z-index: 10;}
  .status-inner{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap;padding:24px 24px;max-width:1180px;margin:0 auto;}
  .status-item{display:flex;align-items:center;gap:12px;}
  .status-item .label{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;opacity: 0.7;}
  .ip-copy{display:flex;align-items:center;gap:12px;background:rgba(6, 10, 19, 0.6);border:1px solid var(--border);padding:6px 6px 6px 16px;border-radius:8px;box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);}
  .ip-copy .value{font-family:'JetBrains Mono';font-size:14.5px;color:var(--blue-bright);font-weight:600;}
  .ip-copy button{background:var(--blue);border:none;color:#04070D;font-weight:700;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.05em;text-transform:uppercase;transition: background .2s;}
  .ip-copy button:hover{background:var(--blue-bright);}
  .status-pill{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:13px;color:var(--ok);background: rgba(74, 222, 128, 0.05);padding: 6px 14px;border-radius: 6px;border: 1px solid rgba(74, 222, 128, 0.15);}

  section{padding:90px 0;border-bottom:1px solid var(--border-soft);position: relative;}
  .section-head{text-align:center;max-width:620px;margin:0 auto 54px;}
  .section-head h2{font-size:clamp(32px,4.5vw,44px);margin-top:12px;}
  .section-head p{color:var(--muted);font-size:16px;margin-top:14px;}

  /* ---------- FEATURES (GLASS GRID) ---------- */
  .feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .feature{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:40px 28px;text-align:center;backdrop-filter:blur(8px);transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);}
  .feature:hover{transform:translateY(-5px);background:var(--panel-hover);border-color:var(--border-hover);box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 20px var(--blue-glow);}
  .feature .icon{width:40px;height:40px;margin:0 auto 22px;color:var(--blue-bright);filter: drop-shadow(0 0 6px var(--blue-glow));}
  .feature h3{font-family:'Space Grotesk';text-transform:none;letter-spacing:0;font-size:18px;font-weight:600;margin-bottom:10px;color: #fff;}
  .feature p{color:var(--muted);font-size:14px;line-height:1.5;}

  /* ---------- STORE ---------- */
  .tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;padding-top:20px;}
  .tier{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px 22px;display:flex;flex-direction:column;backdrop-filter:blur(8px);transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);}
  .tier:hover{transform:translateY(-4px);border-color:var(--blue-bright);background:var(--panel-hover);box-shadow: 0 12px 30px rgba(0,0,0,0.4);}
  .tier .tag{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;opacity: 0.6;}
  .tier h3{font-family:'Space Grotesk';text-transform:none;letter-spacing:0;font-size:20px;font-weight:700;margin-bottom:6px;}
  .tier .price{font-family:'JetBrains Mono';font-size:30px;color:var(--blue-bright);font-weight:700;margin:12px 0 20px;filter: drop-shadow(0 0 10px var(--blue-glow));}
  .tier ul{list-style:none;margin:0 0 24px;padding:0;flex:1;}
  .tier li{font-size:13px;color:var(--muted);padding:9px 0;border-top:1px solid var(--border-soft);display:flex;gap:8px;align-items: center;}
  .tier li:first-child{border-top:none;}
  .tier li::before{content:"✓";color:var(--blue-bright);font-weight:700;}
  
  /* VIP Öne Çıkan Kart */
  .tier.featured{background:linear-gradient(160deg, rgba(240,180,41,0.05), rgba(18,27,45,0.85));border-color:var(--gold);transform:scale(1.04);position:relative;box-shadow: 0 10px 25px rgba(0,0,0,0.3);}
  .tier.featured:hover{transform:scale(1.04) translateY(-6px);border-color:var(--gold-bright);box-shadow:0 15px 35px rgba(240,180,41,0.15), 0 0 25px var(--gold-glow);}
  .tier.featured .price{color:var(--gold-bright);filter: drop-shadow(0 0 10px var(--gold-glow));}
  .tier.featured li::before{color:var(--gold-bright);}
  .ribbon{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, var(--gold), var(--gold-bright));color:#241900;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:6px 16px;border-radius:20px;font-weight:700;white-space:nowrap;box-shadow: 0 4px 10px var(--gold-glow);}
  
  .buy-btn{border:1px solid var(--blue);background:rgba(61,127,232,0.03);color:var(--blue-bright);padding:12px;font-weight:600;cursor:pointer;font-size:13px;font-family:'Space Grotesk';text-transform:uppercase;letter-spacing:0.05em;border-radius:8px;transition:all .2s;}
  .buy-btn:hover{background:var(--blue);color:#04070D;box-shadow: 0 4px 12px var(--blue-glow);}
  .tier.featured .buy-btn{border-color:var(--gold);color:var(--gold-bright);background: rgba(240,180,41,0.03);}
  .tier.featured .buy-btn:hover{background:var(--gold);color:#241900;box-shadow: 0 4px 12px var(--gold-glow);}
  .shop-note{text-align:center;margin-top:34px;color:var(--muted-2);font-size:13px;font-family:'JetBrains Mono';}

  /* ---------- RULES ---------- */
  .rules-list{max-width:760px;margin:0 auto;border-top:1px solid var(--border-soft);}
  .rule-row{display:grid;grid-template-columns:50px 1fr;gap:20px;padding:24px 8px;border-bottom:1px solid var(--border-soft);transition: background .2s;}
  .rule-row:hover{background: rgba(255,255,255,0.01);}
  .rule-row .num{font-family:'JetBrains Mono';color:var(--blue-bright);font-size:20px;font-weight:700;}
  .rule-row h4{font-family:'Space Grotesk';font-weight:600;font-size:16.5px;margin-bottom:6px;color:#fff;}
  .rule-row p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;}

  /* ---------- AUTH (GÜVENLİ GÖRÜNÜM) ---------- */
  .auth-shell{max-width:420px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;backdrop-filter:blur(10px);box-shadow: 0 15px 35px rgba(0,0,0,0.4);}
  .auth-tabs{display:flex;border-bottom:1px solid var(--border-soft);background: rgba(0,0,0,0.15);}
  .auth-tab{flex:1;padding:18px;text-align:center;background:none;border:none;color:var(--muted);font-family:'Space Grotesk';font-weight:600;cursor:pointer;font-size:14.5px;border-bottom:2px solid transparent;transition: all .2s;}
  .auth-tab.active{color:var(--blue-bright);border-bottom-color:var(--blue-bright);background: rgba(61,127,232,0.02);}
  .auth-panel{padding:34px 30px;display:none;}
  .auth-panel.active{display:block;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-family:'JetBrains Mono';font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;opacity: 0.8;}
  .field input{width:100%;background:rgba(6, 10, 19, 0.5);border:1px solid var(--border);color:var(--text);padding:13px 16px;font-family:'Space Grotesk';font-size:14.5px;border-radius:8px;transition: all .25s;box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);}
  .field input:focus{border-color:var(--blue-bright);outline:none;box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 12px var(--blue-glow);background:rgba(6, 10, 19, 0.8);}
  
  .msg{font-size:13px;margin-top:12px;font-family:'JetBrains Mono';min-height:18px;text-align: center;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--danger);}
  
  /* Giriş Yapıldığında Görünecek Profil Barı */
  .session-bar{max-width:640px;margin:0 auto 20px;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg, rgba(240,180,41,0.05), var(--panel));border:1px solid var(--gold);padding:18px 24px;border-radius:10px;font-family:'JetBrains Mono';font-size:13.5px;box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
  .session-bar .who span{color:var(--gold-bright);font-weight:700;}

  /* ---------- ADMIN PANEL ---------- */
  #admin-section{display:none;}
  .admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;backdrop-filter:blur(8px);}
  .stat .n{font-family:'JetBrains Mono';font-size:24px;color:var(--gold-bright);font-weight:700;word-break:break-all;filter: drop-shadow(0 0 8px var(--gold-glow));}
  .stat .l{color:var(--muted);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-family:'JetBrains Mono';margin-top:8px;opacity: 0.7;}
  
  .userlist{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .urow{display:grid;grid-template-columns:1fr 130px;padding:14px 20px;border-top:1px solid var(--border-soft);font-family:'JetBrains Mono';font-size:13.5px;}
  .urow.head{background:rgba(0,0,0,0.2);color:var(--muted);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;border-top:none;}
  .urow .rank{color:var(--gold-bright);}

  /* ---------- FOOTER ---------- */
  footer{padding:80px 0 40px;background: var(--bg-2);border-top: 1px solid var(--border-soft);}
  .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;padding-bottom:50px;border-bottom:1px solid var(--border-soft);}
  .footer-grid h4{font-family:'JetBrains Mono';font-size:12px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:22px;opacity: 0.6;}
  .footer-grid a{display:block;color:var(--muted);font-size:14.5px;margin-bottom:12px;transition: color .2s;}
  .footer-grid a:hover{color:var(--blue-bright);}
  .footer-brand{font-family:'Big Shoulders Display';font-weight:900;font-size:24px;margin-bottom:14px;letter-spacing: 0.05em;}
  .footer-brand-desc{color:var(--muted);font-size:14px;max-width:300px;line-height: 1.5;}
  .footer-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:30px;color:var(--muted-2);font-size:13px;font-family:'JetBrains Mono';}

  /* Responsive Kırılmaları */
  @media (max-width:1024px){
    .feature-grid{grid-template-columns:repeat(2,1fr);}
    .tiers{grid-template-columns:repeat(3,1fr); gap: 16px;}
    .tier.featured{grid-column: span 1; transform: none;}
    .tier.featured:hover{transform: translateY(-4px);}
  }
  @media (max-width:768px){
    .navlinks, .nav-actions{display:none;}
    .burger{display:flex;}
    .status-inner{flex-direction:column;gap:20px;text-align: center;}
    .tiers{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:480px){
    .feature-grid, .footer-grid{grid-template-columns:1fr;}
    .admin-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header id="site-header">
  <nav>
    <div class="logo">
      <div class="crest">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 2l12 6v16l-12 6-12-6V8z" stroke="#6FA3F5" stroke-width="1.6"/><path d="M4 8l12 6 12-6M16 14v16" stroke="#6FA3F5" stroke-width="1.6"/></svg>
      </div>
      LEGACYNW
    </div>
    <div class="navlinks">
      <a href="#ozellikler">Özellikler</a>
      <a href="#magaza">Mağaza</a>
      <a href="#kurallar">Kurallar</a>
      <a href="#hesap">Hesabım</a>
      <a href="#admin-section" id="admin-nav-link" style="display:none;color:var(--gold-bright);">Yönetim</a>
    </div>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="#hesap" id="nav-login-btn">Giriş Yap</a>
      <a class="btn btn-primary" href="https://discord.gg/TRSFz8sWm" target="_blank" rel="noopener">Discord</a>
    </div>
    <button class="burger" id="burger" aria-label="Menü"><span></span><span></span><span></span></button>
  </nav>
  <div class="mobile-menu" id="mobile-menu">
    <a href="#ozellikler">Özellikler</a>
    <a href="#magaza">Mağaza</a>
    <a href="#kurallar">Kurallar</a>
    <a href="#hesap">Hesabım</a>
    <a href="https://discord.gg/TRSFz8sWm" target="_blank" rel="noopener">Discord</a>
  </div>
</header>

<section class="hero">
  <div class="floating-block fb1"></div>
  <div class="floating-block fb2"></div>
  <div class="floating-block fb3"></div>
  <div class="floating-block fb4"></div>
  <div class="hero-content">
    <div class="eyebrow"><span class="dot"></span>Sunucu Aktif</div>
    <h1>LegacyNW'e<br><span class="accent">Katıl</span></h1>
    <p class="lead">Dengeli ekonomi, adil yönetim ve gerçek bir topluluk. Kutunu aç, bölgeni kur, birlikte büyüyün.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="copyIP()">IP'yi Kopyala</button>
      <a class="btn btn-ghost" href="#magaza">Mağazaya Git</a>
